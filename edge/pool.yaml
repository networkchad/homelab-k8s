# kind's bridge subnet. Check it before first boot:
#   docker network inspect kind -f '{{(index .IPAM.Config 0).Subnet}}'
# Keep the range clear of docker's own allocation so nodes can't collide.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab
  namespace: metallb-system
spec:
  addresses:
    - 172.18.0.240-172.18.0.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab
