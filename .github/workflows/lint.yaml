name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - run: pip install yamllint==1.38.0
      - run: yamllint .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo is public: keep credentials out of it.
      - name: No plaintext Secrets
        run: |
          if grep -rEn '^[[:space:]]*kind:[[:space:]]*Secret' --include='*.yaml' .; then
            echo "::error::plaintext Secret in git - use sops, sealed-secrets or external-secrets"
            exit 1
          fi

      # Renders every HelmRelease, then checks every manifest against the CRDs
      # that will read it. See hack/validate.sh.
      - name: Validate
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o "$HOME/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz |
            tar xz -C "$HOME/bin"
          chmod +x "$HOME/bin/yq" "$HOME/bin/kubeconform"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ./hack/validate.sh

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - run: docker run --rm -v "$PWD:/src:ro" -w /src koalaman/shellcheck:stable hack/*.sh
