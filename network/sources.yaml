# Envoy Gateway publishes its chart as an OCI artifact on Docker Hub and has no
# helm index; OCIRepository is flux's native way to consume one.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.10.0
