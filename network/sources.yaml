# Envoy Gateway publishes its chart as an OCI artifact on Docker Hub and has no
# helm index, so this is a HelmRepository of type oci: the last path segment is
# the chart name and the tag is the chart version.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  type: oci
  interval: 1h
  url: oci://docker.io/envoyproxy
