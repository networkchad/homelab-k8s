# GatewayClass nginx comes from this chart; the data plane is created per Gateway.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-gateway-fabric
  namespace: nginx-gateway
spec:
  interval: 30m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nginx-gateway-fabric
      version: 2.9.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: nginx-charts
  values:
    nginxGateway:
      productTelemetry:
        enable: false
      # Metrics are exposed on :9113; the chart's ServiceMonitor stays off so
      # this area doesn't depend on the monitoring area's CRDs.
      metrics:
        enable: true
    nginx:
      replicas: 1
      service:
        # MetalLB only advertises from nodes running a data plane pod.
        externalTrafficPolicy: Local
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
