# Control plane only: the data plane arrives with the Gateway in gateway.yaml.
# The bundled crds/ directory also installs the Gateway API CRDs (bundle v1.6.1)
# and Envoy Gateway's own. Helm installs those once and never upgrades them, so
# bump them by hand when you bump this chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chartRef:
        kind: OCIRepository
        name: envoy-gateway
  values:
    deployment:
      envoyGateway:
        # Chart default asks for 100m CPU; one box does not need that.
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
    # Zone-aware routing between one host's three containers: no. It also installs
    # a mutating webhook in front of every data plane pod.
    topologyInjector:
      enabled: false
