# Layer 2 only: FRR is off, so no BGP daemonset.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: metallb
      version: 0.16.2
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
