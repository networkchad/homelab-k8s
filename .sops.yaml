# Which secrets get encrypted with which keys. sops reads this file from the repo root,
# so `sops --encrypt --in-place monitoring/secrets.yaml` needs no key argument, and the
# recipient here is the only one that can decrypt anything committed.
#
# Public key of ~/.config/sops/age/keys.txt, the private half of which lives on the host that
# bootstraps the cluster and is committed to nothing (the README's *The age key* makes one):
#
#   age1aqwcvjxkxptny4qqnl2xq9m4dw4p3dhdcq6k7sz4wz7y4z5rdsuqxzle3r
#
# Matched by name rather than path so a new secrets file cannot be forgotten: the rule
# covers every secrets*.yaml in the repo, and one recipient is the point - a per-directory
# key would only add a second key file to keep.
creation_rules:
  - path_regex: secrets\.yaml$
    encrypted_regex: '^(data|stringData)$'
    age: "age1aqwcvjxkxptny4qqnl2xq9m4dw4p3dhdcq6k7sz4wz7y4z5rdsuqxzle3r"
