kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Context becomes kind-homelab; flux, k9s and helm all key off this name.
name: homelab

networking:
  # Nothing off this host needs the api server.
  apiServerAddress: 127.0.0.1
  # ipvs would need ip_vs* host modules; none leaves Service networking to the CNI.
  kubeProxyMode: iptables

nodes:
  # Pinned by digest, which kind requires for prebuilt images. 1.35+ needs cgroup v2.
  # No 80/443 extraPortMappings: the front door is a MetalLB address on the kind
  # bridge, reachable from the host directly - see gateway/ and README.
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      # kind's only StorageClass is local-path: a volume is a directory on one node and
      # its PV is pinned there. See README.
      homelab.internal/stateful: "true"

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
