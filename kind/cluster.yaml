kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Context becomes kind-homelab; flux, k9s and helm all key off it.
name: homelab

networking:
  ipFamily: ipv4
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16

  # ipvs needs ip_vs* host kernel modules; none means no Service networking
  # until a CNI provides it.
  kubeProxyMode: iptables

  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
  disableDefaultCNI: false

nodes:
  - role: control-plane
    # Pinned by digest: kind requires it for prebuilt node images.
    # 1.35+ needs cgroup v2 on the host.
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      topology.kubernetes.io/zone: local-a
    # No 80/443 mappings: the edge is a MetalLB IP on the kind bridge, reachable
    # from the host directly. See network/ and README.

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      topology.kubernetes.io/zone: local-a

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      topology.kubernetes.io/zone: local-b
