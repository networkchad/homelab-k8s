apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # Its HTTPRoute needs the Gateway API CRDs and the web Gateway.
  dependsOn:
    - name: gateway
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./headlamp
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: headlamp, namespace: headlamp}
