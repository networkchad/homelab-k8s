apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gpu
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./gpu
  healthChecks:
    - {apiVersion: apps/v1, kind: DaemonSet, name: nvidia-device-plugin, namespace: gpu}
