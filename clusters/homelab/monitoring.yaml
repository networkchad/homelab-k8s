apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  dependsOn:
    - name: gateway
    - name: auth
  # The grafana admin password and OIDC secret are sops ciphertext; see README.
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./monitoring
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: kube-prometheus-stack, namespace: monitoring}
