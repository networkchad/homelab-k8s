# One of these per area of the cluster. Paths are repo-relative; the area owns
# its own namespaces, HelmRepository and HelmReleases.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
