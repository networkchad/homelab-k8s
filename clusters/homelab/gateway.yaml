# Applies only once every CRD it reads exists, and reports ready only once the
# certificate is issued and the data plane has its address, so the areas behind it
# never deploy against a Gateway that cannot serve.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: platform
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./gateway
