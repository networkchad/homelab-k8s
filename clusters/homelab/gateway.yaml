# wait: ready then means the certificate is issued and the data plane has its address.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: platform
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./gateway
