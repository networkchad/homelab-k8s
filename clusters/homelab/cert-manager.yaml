apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # network/ depends on this: its Certificates need the cert-manager CRDs.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cert-manager
