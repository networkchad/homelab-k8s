# Gateway API CRDs, pinned to the release NGINX Gateway Fabric 2.9 validates
# against. Cluster-scoped, so this lands before the network area.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.7.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 5m
  timeout: 5m
  wait: true
  # Never garbage collect CRDs: pruning them deletes every custom resource.
  pruning: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd
