# Self-reference: flux reconciles this repo, starting at clusters/homelab. Applied by
# hand exactly once (README); every later change arrives through git.
# Public repo, so no secretRef. If it goes private, use the ssh url plus a
# secretRef named flux-system.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  ref: {branch: main}
  url: https://github.com/networkchad/homelab-k8s.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./clusters/homelab
