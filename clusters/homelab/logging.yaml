apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 15m
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./logging
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: loki, namespace: logging}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: fluent-bit, namespace: logging}
