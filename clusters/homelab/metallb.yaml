apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  pruning: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./metallb
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metallb
      namespace: metallb-system
