apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: edge
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  prune: true
  # cert-manager.io and metallb.io CRDs come from those two releases; the
  # Gateway API CRDs come with Envoy Gateway. Waiting on all three means every
  # document here applies on the first try.
  dependsOn:
    - name: cert-manager
    - name: metallb
    - name: network
  # Also means the areas behind the Gateway only deploy once the Certificate is
  # issued, which is the part that can fail quietly.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./edge
