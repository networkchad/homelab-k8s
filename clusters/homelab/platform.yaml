# Ready = all four platform releases installed. Everything downstream waits on that,
# because gateway/ reads CRDs three of those charts install.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 20m
  prune: true
  wait: true
  sourceRef: {kind: GitRepository, name: flux-system}
  path: ./platform
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: metrics-server, namespace: metrics-server}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: cert-manager, namespace: cert-manager}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: metallb, namespace: metallb-system}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: envoy-gateway, namespace: envoy-gateway-system}
