# One file per area directory: where it lives, what it waits for, how to tell it is
# healthy. platform/ first, because its charts install the CRDs gateway/ declares
# objects for, and gateway/ before the apps, because their routes need a Gateway that
# serves. auth/ before the apps that send you to it. New area = one directory plus one
# file here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system/gotk-sync.yaml
  - platform.yaml
  - gateway.yaml
  - auth.yaml
  - logging.yaml
  - headlamp.yaml
  - monitoring.yaml
  - gpu.yaml
