# The GPU: one worker advertises nvidia.com/gpu and counts what is asked of it, and the driver
# reaches containers as a mount rather than through a runtime. See README for why it has to be
# this way on a kind cluster, and what a pod has to carry to use it.
apiVersion: v1
kind: Namespace
metadata:
  name: gpu
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-device-plugin
  namespace: gpu
---
# Counts the GPU so one can be asked for by name and scheduled. It is only an accountant here:
# what it hands kubelet for a device is NVIDIA_VISIBLE_DEVICES, a note written for the nvidia
# runtime that kind cannot give this node, so a CUDA pod gets its device nodes by being
# privileged instead - README. No CDI strategy is set either, because that mode has the plugin
# write a CDI spec, which it can only do by finding libcuda.so in an ld.so.cache NixOS does not
# keep. Counting needs libnvidia-ml, and on NixOS the driver is nowhere near a default library
# path, hence LD_LIBRARY_PATH and the two mounts; that is also why the nvidia-device-plugin chart
# is not used, since it has no value that puts a library path in the plugin's own container. Its
# other halves - gfd, mps, mig, nfd - are unneeded either.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: gpu
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: nvidia-device-plugin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nvidia-device-plugin}
    spec:
      serviceAccountName: nvidia-device-plugin
      # Only one node has the GPU mounted in: kind/cluster.yaml.
      nodeSelector: {homelab.internal/gpu: "true"}
      containers:
        - name: plugin
          # appVersion of nvidia-device-plugin chart 0.20.2.
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
          command: [nvidia-device-plugin]
          env:
            - {name: LD_LIBRARY_PATH, value: /driver/lib}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: device-plugins, mountPath: /var/lib/kubelet/device-plugins}
            - {name: driver, mountPath: /driver}
            # The driver directory is symlinks into the store, so the store has to be here too
            # for anything in this container to load them.
            - {name: nix-store, mountPath: /nix/store}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
      volumes:
        - {name: device-plugins, hostPath: {path: /var/lib/kubelet/device-plugins}}
        - {name: driver, hostPath: {path: /run/opengl-driver}}
        - {name: nix-store, hostPath: {path: /nix/store}}
---
# What the card is doing. Not dcgm-exporter: DCGM is a library the exporter loads alongside
# NVML, and the NixOS driver package does not ship it, so the choice is made for us here. And
# not the exec backend either, which shells out to nvidia-smi - that binary is its own store
# output, and a metrics pod should not have to know a store hash. This one loads
# libnvidia-ml.so.1 in-process, so it needs what the plugin needs and nothing else.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-gpu-exporter
  namespace: gpu
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: nvidia-gpu-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nvidia-gpu-exporter}
    spec:
      # Per-process metrics name the container a process belongs to by reading its cgroup out
      # of /proc, which means seeing the other containers' processes at all. The card is shared
      # with the desktop, so this is also the only way to tell which of the two used it.
      hostPID: true
      nodeSelector: {homelab.internal/gpu: "true"}
      containers:
        - name: exporter
          image: ghcr.io/utkuozdemir/nvidia_gpu_exporter:2.0.0
          args:
            - --collect.compute-apps
            - --collect.compute-apps-identity
          env:
            - {name: LD_LIBRARY_PATH, value: /run/opengl-driver/lib}
          securityContext:
            privileged: true
          ports:
            - {name: http, containerPort: 9835}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: driver, mountPath: /run/opengl-driver, readOnly: true}
            - {name: nix-store, mountPath: /nix/store, readOnly: true}
            - {name: nvidiactl, mountPath: /dev/nvidiactl}
            - {name: nvidia0, mountPath: /dev/nvidia0}
            - {name: nvidia-uvm, mountPath: /dev/nvidia-uvm}
      volumes:
        - {name: driver, hostPath: {path: /run/opengl-driver}}
        - {name: nix-store, hostPath: {path: /nix/store}}
        - {name: nvidiactl, hostPath: {path: /dev/nvidiactl}}
        - {name: nvidia0, hostPath: {path: /dev/nvidia0}}
        - {name: nvidia-uvm, hostPath: {path: /dev/nvidia-uvm}}
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gpu-exporter
  namespace: gpu
  labels: {app.kubernetes.io/name: nvidia-gpu-exporter}
spec:
  selector: {app.kubernetes.io/name: nvidia-gpu-exporter}
  ports:
    - {name: http, port: 9835, targetPort: http}
---
# monitoring/ sets serviceMonitorSelector to {} - every ServiceMonitor in the cluster is read,
# which is why this needs no label for Prometheus to find it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-gpu-exporter
  namespace: gpu
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: nvidia-gpu-exporter}
  endpoints:
    - {port: http, path: /metrics, interval: 1m}
