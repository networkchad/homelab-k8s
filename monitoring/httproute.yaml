apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - kind: Gateway
      name: web
      namespace: web
      sectionName: https
  hostnames:
    - grafana.homelab.test
  rules:
    - backendRefs:
        - name: kube-prometheus-grafana
          port: 80
