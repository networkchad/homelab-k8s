# prometheus, alertmanager, grafana. The three stateful pods select the node labelled
# homelab.internal/stateful because kind's local-path volumes are pinned to one node.
# Grafana is where the logs from logging/ are read, and Authelia is how anyone who is not
# the admin gets in.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: {homelab.internal/gateway: web}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  maxHistory: 3
  install: {remediation: {retries: 3}}
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.6.0
      interval: 1h
      sourceRef: {kind: HelmRepository, name: prometheus-community}
  values:
    # etcd, scheduler and controller-manager bind 127.0.0.1 inside kind nodes, so the
    # pod network can never reach them: off, along with their alert rules.
    kubeEtcd: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeControllerManager: {enabled: false}
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false

    prometheus:
      prometheusSpec:
        # Otherwise only monitors carrying this release's labels are selected, and
        # every later app's ServiceMonitor is silently ignored.
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        ruleSelector: {}
        # A week of series, and the volume stops making room once it is 80% full.
        retention: 7d
        retentionSize: 8GB
        nodeSelector: {homelab.internal/stateful: "true"}
        resources:
          requests: {cpu: 50m, memory: 400Mi}
        # Default is emptyDir: series vanish on every pod restart. storageClassName
        # stays unset so the cluster default applies.
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 10Gi}}

    alertmanager:
      alertmanagerSpec:
        retention: 48h
        nodeSelector: {homelab.internal/stateful: "true"}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 1Gi}}

    grafana:
      nodeSelector: {homelab.internal/stateful: "true"}
      resources:
        requests: {cpu: 10m, memory: 96Mi}
      persistence:
        enabled: true
        accessModes: [ReadWriteOnce]
        size: 1Gi
      # monitoring/secrets.yaml: the chart takes the admin pair from it, Grafana reads the
      # OIDC client secret from it as the environment variable its config key names.
      admin: {existingSecret: grafana}
      envValueFrom:
        # The name is the environment variable; Grafana reads a GF_ variable in place of
        # the config key it is spelled from.
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef: {name: grafana, key: oidc-client-secret}
      grafana.ini:
        server:
          # The address the browser is sent to, and so the address the redirect_uri sent
          # to Authelia has to match.
          root_url: https://grafana.homelab.internal/
        auth:
          # Left on deliberately: with Authelia in front of everything else, this form is
          # how you get in to find out why Authelia is not.
          disable_login_form: false
        # The dotted key is the ini section name, which is why this is not nested: nested,
        # the chart writes it as one incomprehensible line under [auth].
        auth.generic_oauth:
          enabled: true
          name: Authelia
          client_id: grafana
          auth_url: https://auth.homelab.internal/api/oidc/authorization
          # Browser-facing and server-facing apart, on purpose: Grafana talks to the
          # Service over the pod network, and nothing in here resolves
          # auth.homelab.internal. Discovery is off for the same reason, which is why the
          # three endpoints are spelled out.
          token_url: http://authelia.authelia.svc.cluster.local:9091/api/oidc/token
          api_url: http://authelia.authelia.svc.cluster.local:9091/api/oidc/userinfo
          jwk_set_url: http://authelia.authelia.svc.cluster.local:9091/api/oidc/jwks
          validate_id_token: true
          scopes: openid profile email groups offline_access
          use_refresh_token: true
          # The groups in auth/users.yaml decide the role; admins are admins everywhere.
          role_attribute_path: contains(groups[*], 'admins') && 'GrafanaAdmin' || 'Viewer'
          allow_assign_grafana_admin: true
      # The logs logging/ keeps, in the UI that is already here.
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.logging.svc.cluster.local:3100
          jsonData: {maxLines: 1000}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs: [{kind: Gateway, name: web, namespace: web, sectionName: https}]
  hostnames: [grafana.homelab.internal]
  rules:
    # The chart prefixes services with the release name.
    - backendRefs: [{name: kube-prometheus-stack-grafana, port: 80}]
