apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.6.0
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # etcd, scheduler and controller-manager bind 127.0.0.1 inside kind nodes, so
    # pod network can never reach them: off, along with their alert rules.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false

    prometheus:
      prometheusSpec:
        # Otherwise Prometheus only selects monitors carrying this release's
        # labels, and every future app's ServiceMonitor is silently ignored.
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        ruleSelector: {}
        retention: 48h
        resources:
          requests:
            cpu: 50m
            memory: 400Mi
        # Default is emptyDir: series vanish on every pod restart.
        # storageClassName left unset on purpose, so the cluster default applies.
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 10Gi

    alertmanager:
      alertmanagerSpec:
        retention: 48h
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi

    grafana:
      # No adminPassword here: this repo is public. The chart generates one.
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
      persistence:
        enabled: true
        accessModes: [ReadWriteOnce]
        size: 1Gi
