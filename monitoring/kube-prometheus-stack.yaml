# prometheus, alertmanager, grafana. The three stateful pods select the node labelled
# homelab.internal/stateful because kind's local-path volumes are pinned to one node.
# Grafana is where the logs from logging/ are read, and Authelia is how anyone who is not
# the admin gets in.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: {homelab.internal/gateway: web}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  maxHistory: 3
  install: {remediation: {retries: 3}}
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.6.0
      interval: 1h
      sourceRef: {kind: HelmRepository, name: prometheus-community}
  values:
    # etcd, scheduler and controller-manager bind 127.0.0.1 inside kind nodes, so the
    # pod network can never reach them: off, along with their alert rules.
    kubeEtcd: {enabled: false}
    kubeScheduler: {enabled: false}
    kubeControllerManager: {enabled: false}
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeControllerManager: false

    prometheus:
      prometheusSpec:
        # Otherwise only monitors carrying this release's labels are selected, and
        # every later app's ServiceMonitor is silently ignored.
        serviceMonitorSelector: {}
        podMonitorSelector: {}
        ruleSelector: {}
        # A week of series, and the volume stops making room once it is 80% full.
        retention: 7d
        retentionSize: 8GB
        nodeSelector: {homelab.internal/stateful: "true"}
        resources:
          requests: {cpu: 50m, memory: 400Mi}
        # Default is emptyDir: series vanish on every pod restart. storageClassName
        # stays unset so the cluster default applies.
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 10Gi}}

    alertmanager:
      alertmanagerSpec:
        retention: 48h
        nodeSelector: {homelab.internal/stateful: "true"}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 1Gi}}

    grafana:
      nodeSelector: {homelab.internal/stateful: "true"}
      resources:
        requests: {cpu: 10m, memory: 96Mi}
      persistence:
        enabled: true
        accessModes: [ReadWriteOnce]
        size: 1Gi
      # monitoring/secrets.yaml: the chart takes the admin pair from it.
      admin: {existingSecret: grafana}
      grafana.ini:
        server:
          # The address the browser is sent to.
          root_url: https://grafana.homelab.internal/
        auth:
          # Left on deliberately: with Authelia in front of everything else, this form is
          # how you get in to find out why Authelia is not.
          disable_login_form: false
      # The logs logging/ keeps, in the UI that is already here. The uid is spelled out because
      # gpu/'s dashboard names it: left to Grafana it is a hash of the name.
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          uid: loki
          url: http://loki.logging.svc.cluster.local:3100
          jsonData: {maxLines: 1000}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs: [{kind: Gateway, name: web, namespace: web, sectionName: https}]
  hostnames: [grafana.homelab.internal]
  rules:
    # The chart prefixes services with the release name.
    - backendRefs: [{name: kube-prometheus-stack-grafana, port: 80}]
---
# The same gate Headlamp has: the Gateway asks Authelia on every request whether the
# browser carries a session, and sends it to Authelia when it does not. Grafana then asks
# for its own password, because that is the only way it knows how to authorise a dashboard.
# extAuth is the whole story here - no client, no callback, no secret.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: grafana}]
  extAuth:
    failOpen: false
    # What Authelia reads to decide: the session, and the URL the session is being spent
    # on. It works that out from the forwarded protocol and the host, so those two have to
    # arrive or every check is a denial.
    headersToExtAuth: [Authorization, Cookie, X-Forwarded-Proto, X-Forwarded-Host]
    http:
      backendRefs: [{name: authelia, namespace: authelia, port: 9091}]
      pathOverride: /api/authz/ext-authz
