apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - kind: Gateway
      name: web
      namespace: web
      sectionName: https
  hostnames:
    - headlamp.homelab.test
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
